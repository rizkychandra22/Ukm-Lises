name: CI Pipeline

on:
  push:
    branches: [ "main", "development", "feat/*" ]
  pull_request:
    branches: [ "main", "development" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # 1. FRONTEND CI (React + TypeScript + Vite + ESLint)
  # ==========================================================
  frontend-ci:
    name: Frontend (Lint + TypeCheck + Build)
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npx tsc -b resources/js/FrontEnd-React-Ts/tsconfig.json && npx tsc -b resources/js/Inertia-React-Ts/tsconfig.json

      - name: Build Vite App (SPA & Inertia)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: frontend-build
          path: public/build/
          retention-days: 7

  # ==========================================================
  # 2. BACKEND CI (Laravel PHP)
  # ==========================================================
  backend-ci:
    name: Backend (PHPUnit Test)
    runs-on: self-hosted

    # Hapus bagian services db ini jika self-hosted runner Anda 
    # sudah punya database postgres sendiri yang berjalan.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pgsql, bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, tokenizer, xml

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Migrations for Testing
        run: php artisan migrate:fresh --seed
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: password

      - name: Execute Backend Tests
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: password
