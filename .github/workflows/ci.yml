name: CI Pipeline

on:
  push:
    branches: [ "main", "development", "feat/*" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  build-and-test:
    name: Build & Test (Frontend & Backend)
    runs-on: self-hosted

    # Memaksa runner Windows menggunakan Bash agar semua perintah Linux-style berjalan lancar
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ================== FRONTEND ==================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npx tsc -b resources/js/FrontEnd-React-Ts/tsconfig.json && npx tsc -b resources/js/Inertia-React-Ts/tsconfig.json

      - name: Build Vite App (SPA & Inertia)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: frontend-build
          path: public/build/
          retention-days: 7

      # ================== BACKEND ==================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pgsql, bcmath, ctype, fileinfo, json, mbstring, openssl, pdo, tokenizer, xml

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Migrations for Testing
        run: php artisan migrate:fresh --seed
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      - name: Execute Backend Tests
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
