name: CI

on:
  pull_request:
    branches: [ main, development ]

# Membatalkan proses CI sebelumnya jika ada push baru di branch yang sama
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # 1. FRONTEND CI (React + TypeScript + Vite + ESLint)
  # ==========================================================
  frontend-ci:
    name: Frontend (ESLint + TypeCheck + Vite Build)
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 1. Menjalankan ESLint untuk mengecek code quality
      - name: Run ESLint
        run: npm run lint

      # 2. Menjalankan Typecheck (Terpisah agar lebih cepat mendeteksi error TypeScript)
      - name: Run Typecheck
        run: npx tsc -b resources/js/!FrontEnd-React-Ts/tsconfig.json

      # 3. Menjalankan Frontend Unit Test (Bisa diaktifkan nanti jika sudah memakai Vitest/Jest)
      - name: Run Frontend Tests
        run: echo "No frontend tests configured yet."

      # 4. Menjalankan Production Build dengan Vite
      - name: Build Vite App
        run: npm run build
        env:
          NODE_ENV: production

      # 5. Menyimpan hasil build (Artifacts) agar bisa di-download jika dibutuhkan
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build/
          retention-days: 7

  # ==========================================================
  # 2. BACKEND CI (Laravel PHP) - Temporarily Disabled
  # ==========================================================
  backend-ci:
    name: Backend (PHPUnit Test)
    runs-on: self-hosted
    steps:
      - name: Skip Backend Tests
        run: echo "Backend is not set up yet. Skipping tests..."
