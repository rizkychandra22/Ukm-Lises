name: CD

on:
  push:
    branches: [ main, development, feat/* ]

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # 1. FRONTEND CI (React + TypeScript + Vite + ESLint)
  # ==========================================================
  frontend-ci:
    name: Frontend (ESLint + TypeCheck + Vite Build)
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npx tsc -b resources/js/FrontEnd-React-Ts/tsconfig.json

      - name: Run Frontend Tests
        run: echo "No frontend tests configured yet."

      - name: Build Vite App
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: frontend-build
          path: public/build/
          retention-days: 7

  # ==========================================================
  # 2. BACKEND CI (Laravel PHP) - Temporarily Disabled
  # ==========================================================
  backend-ci:
    name: Backend (PHPUnit Test)
    runs-on: self-hosted
    steps:
      - name: Skip Backend Tests
        run: echo "Backend is not set up yet. Skipping tests..."

  # ==========================================================
  # 3. DEPLOYMENT (CD - Hanya jika Frontend & Backend CI Lulus)
  # ==========================================================
  deploy:
    name: Deploy to Production
    needs: [frontend-ci]
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Trigger Webhook / Auto-Deploy
        run: |
          echo "🚀 All quality checks passed! Deploying to production..."
          # Jika memakai webhook Laravel Cloud / Forge:
          # curl -X POST "${{ secrets.LARAVEL_CLOUD_DEPLOY_WEBHOOK }}"
