name: CD Pipeline

# Deployment hanya berjalan SETELAH "CI Pipeline" (ci.yml) sukses berjalan di branch main / development
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
      - development

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # DEPLOYMENT (Hanya jika CI Lulus)
  # ==========================================================
  deploy:
    name: Deploy to Server
    # Memastikan deployment HANYA berjalan jika CI dinyatakan 'success'
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Script
        run: |
          echo "🚀 Quality checks passed. Deploying to server..."
          # -------------------------------------------------------------
          # Tulis perintah deployment Anda di bawah ini
          # Contoh jika pull langsung di server:
          # cd /path/to/your/project
          # git pull origin main
          # composer install --no-dev --optimize-autoloader
          # php artisan migrate --force
          # npm ci
          # npm run build
          # php artisan config:cache
          # php artisan route:cache
          # php artisan view:cache
          # php artisan queue:restart
          # -------------------------------------------------------------

      # Alternatif: Jika menggunakan webhook Laravel Cloud / Forge
      # - name: Trigger Webhook
      #   run: curl -X POST "${{ secrets.LARAVEL_CLOUD_DEPLOY_WEBHOOK }}"
